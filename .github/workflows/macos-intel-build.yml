name: Intel Mac desktop build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vapor_board/**'
      - 'packaging/**'
      - '.github/workflows/macos-intel-build.yml'
jobs:
  mac-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build app and DMG
        run: sh packaging/build_macos_intel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Vapor-Board-Intel-unsigned
          path: |
            dist/Vapor Board.app
            dist/Vapor-Board-Intel.dmg
